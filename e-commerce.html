<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookStore CM - Pay with MoMo</title>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Smart Checkout</h1>
    <p>Pay with MTN MoMo or Orange Money</p>
  </div>

  <div class="body">
    <div class="book">
      <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=200" alt="Book">
      <div>
        <h3 style="font-size:16px;">My Favorite Book</h3>
        <p style="font-size:13px; color:#6b7280;">Free Delivery - Bamenda/Buea/Dla</p>
      </div>
    </div>

    <label>Price Per Book (FCFA)</label>
    <input type="number" id="price" value="15" oninput="calculate()">
    
    <label>Quantity</label>
    <input type="number" id="qty" value="3" oninput="calculate()">
    
    <label>Your MoMo Number</label>
    <input type="tel" id="momoNumber" placeholder="6XX XXX XXX" value="">

    <div class="summary">
      <div class="row"><span>Subtotal</span><span id="subtotal">0 FCFA</span></div>
      <div class="row green"><span>Discount (10%)</span><span id="discountAmount">-0 FCFA</span></div>
      <div class="row"><span>After Discount</span><span id="afterDiscount">0 FCFA</span></div>
      <div class="row"><span>Tax (8%)</span><span id="taxAmount">0 FCFA</span></div>
      <div class="row total"><span>Grand Total</span><span id="grandTotal">0 FCFA</span></div>
    </div>

    <p class="pay-title">Choose payment:</p>
    <div class="momo-grid">
      <button class="momo-btn mtn" onclick="pay('MTN')">
        <span>🟨</span> MTN MoMo
      </button>
      <button class="momo-btn orange" onclick="pay('Orange')">
        <span>🟧</span> Orange Money
      </button>
    </div>

    <div id="status" class="status"></div>
  </div>
</div>
</body>
</html>
